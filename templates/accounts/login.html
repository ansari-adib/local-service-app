 
{% extends 'base.html' %}

{% block title %}Login — ServiceBook{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-box-arrow-in-right text-primary" style="font-size:2.5rem;"></i>
                    <h3 class="fw-bold mt-2">Welcome Back</h3>
                    <p class="text-muted">Login to your ServiceBook account</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        {{ form.password }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>

                <hr>

                <div class="text-center">
                    <p class="mb-1">Don't have an account?</p>
                    <a href="{% url 'register_customer' %}" class="btn btn-outline-primary btn-sm me-2">
                        Register as Customer
                    </a>
                    <a href="{% url 'register_provider' %}" class="btn btn-outline-success btn-sm">
                        Register as Provider
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
